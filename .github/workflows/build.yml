name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read  # the build (which installs dmgbuild from PyPI) can't write to the repo

jobs:
  build:
    runs-on: macos-15  # project format (objectVersion 77) needs Xcode 16+
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags and history, so make-dmg.sh can read the version and build number
      - run: scripts/test-engine.sh  # the engine must give the answers in tests/fixtures
      - run: scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: JuiceTracker-dmg
          path: dist/JuiceTracker.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # the C# engine must give the same answers in tests/fixtures as the Swift one
      - run: dotnet run --project windows/JuiceTracker.Tests -c Release
      # one self-contained JuiceTracker.exe (no .NET install needed), versioned from the latest v* tag
      - shell: bash
        run: |
          v=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0); v=${v#v}
          dotnet publish windows/JuiceTracker.App -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=$v.0 -o dist/windows
      # open the built app and every screen, then quit: a layout or resource that fails to load fails the build
      - shell: pwsh
        timeout-minutes: 3
        run: |
          $p = Start-Process dist/windows/JuiceTracker.exe -ArgumentList '--smoke-test' -PassThru -Wait
          Get-Content "$env:TEMP/juicetracker-smoke.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "The app failed its smoke test (exit $($p.ExitCode))"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: JuiceTracker-windows
          path: dist/windows/JuiceTracker.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only this job publishes, and it runs no third-party code
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: JuiceTracker-dmg
      - uses: actions/download-artifact@v4
        with:
          name: JuiceTracker-windows
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" JuiceTracker.dmg JuiceTracker.exe --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
