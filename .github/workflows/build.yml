name: Build DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15  # project format (objectVersion 77) needs Xcode 16+
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags and history, so make-dmg.sh can read the version and build number
      - run: scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: JuiceTracker-dmg
          path: dist/JuiceTracker.dmg
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/JuiceTracker.dmg --title "$GITHUB_REF_NAME" --generate-notes
