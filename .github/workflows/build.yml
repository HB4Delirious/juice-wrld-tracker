name: Build DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read  # the build (which installs dmgbuild from PyPI) can't write to the repo

jobs:
  build:
    runs-on: macos-15  # project format (objectVersion 77) needs Xcode 16+
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags and history, so make-dmg.sh can read the version and build number
      - run: node --test tests/core.test.mjs
      - run: scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: JuiceTracker-dmg
          path: dist/JuiceTracker.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only this job publishes, and it runs no third-party code
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: JuiceTracker-dmg
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" JuiceTracker.dmg --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
