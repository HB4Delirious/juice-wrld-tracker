name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read  # the build (which installs dmgbuild from PyPI) can't write to the repo

jobs:
  build:
    runs-on: macos-15  # project format (objectVersion 77) needs Xcode 16+
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags and history, so make-dmg.sh can read the version and build number
      - run: scripts/test-engine.sh  # the engine must give the answers in tests/fixtures
      - run: scripts/make-dmg.sh
      # going live: the app's RTMP sender streams a test picture and tone into ffmpeg, which must be able to decode it
      - name: Live stream self-test
        timeout-minutes: 8
        run: |
          brew install ffmpeg >/dev/null 2>&1
          ffmpeg -hide_banner -loglevel error -listen 1 -i rtmp://127.0.0.1:1935/live/test -c copy -y "$RUNNER_TEMP/live.flv" &
          receiver=$!
          sleep 3
          build/Release/JuiceTracker.app/Contents/MacOS/JuiceTracker --rtmp-selftest rtmp://127.0.0.1:1935/live test
          wait $receiver
          ffprobe -v error -show_entries stream=codec_name,width,height -of csv=p=0 "$RUNNER_TEMP/live.flv" | tee "$RUNNER_TEMP/probe.txt"
          grep -q '^h264,1080,1920' "$RUNNER_TEMP/probe.txt" && grep -q '^aac' "$RUNNER_TEMP/probe.txt"
          ffmpeg -v error -i "$RUNNER_TEMP/live.flv" -f null - && echo "live stream decodes: h264 1080x1920 + aac"
      - uses: actions/upload-artifact@v4
        with:
          name: JuiceTracker-dmg
          path: dist/JuiceTracker.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # the C# engine must give the same answers in tests/fixtures as the Swift one
      - run: dotnet run --project windows/JuiceTracker.Tests -c Release
      # one self-contained JuiceTracker.exe (no .NET install needed), versioned from the latest v* tag
      - shell: bash
        run: |
          v=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0); v=${v#v}
          dotnet publish windows/JuiceTracker.App -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=$v.0 -o dist/windows
      # open the built app and every screen, then quit: a layout or resource that fails to load fails the build
      - shell: pwsh
        timeout-minutes: 3
        run: |
          $p = Start-Process dist/windows/JuiceTracker.exe -ArgumentList '--smoke-test' -PassThru -Wait
          Get-Content "$env:TEMP/juicetracker-smoke.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "The app failed its smoke test (exit $($p.ExitCode))"; exit 1 }
      # going live: the app draws the stream picture and sends it through FFmpeg (the pinned build it fetches) into an
      # RTMP receiver; the recording must decode as H.264 + AAC
      - name: Live stream self-test
        shell: pwsh
        timeout-minutes: 8
        run: |
          $dir = "$env:LOCALAPPDATA\JuiceTracker\ffmpeg-9.0.2"; New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip -OutFile ff.zip
          if ((Get-FileHash ff.zip -Algorithm SHA256).Hash -ne '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba') { throw "FFmpeg's fingerprint changed" }
          Expand-Archive ff.zip -DestinationPath ffx
          Copy-Item (Get-ChildItem ffx -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName "$dir\ffmpeg.exe"
          $ff = "$dir\ffmpeg.exe"
          $recv = Start-Process $ff -ArgumentList '-hide_banner','-loglevel','error','-listen','1','-i','rtmp://127.0.0.1:1935/live/test','-c','copy','-y',"$env:RUNNER_TEMP\live.flv" -PassThru
          Start-Sleep 3
          $app = Start-Process dist/windows/JuiceTracker.exe -ArgumentList '--rtmp-selftest','rtmp://127.0.0.1:1935/live','test' -PassThru -Wait
          Get-Content "$env:TEMP\juicetracker-live.txt" -ErrorAction SilentlyContinue
          if ($app.ExitCode -ne 0) { Write-Error "The live self-test failed (exit $($app.ExitCode))"; exit 1 }
          $recv | Wait-Process -Timeout 30
          $info = & $ff -hide_banner -i "$env:RUNNER_TEMP\live.flv" -f null - 2>&1 | Out-String
          $info -split "`n" | Select-String 'Stream #'
          if ($info -notmatch 'Video: h264' -or $info -notmatch 'Audio: aac') { Write-Error "The stream didn't decode as H.264 + AAC"; exit 1 }
          "live stream decodes: h264 + aac"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: JuiceTracker-windows
          path: dist/windows/JuiceTracker.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only this job publishes, and it runs no third-party code
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: JuiceTracker-dmg
      - uses: actions/download-artifact@v4
        with:
          name: JuiceTracker-windows
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" JuiceTracker.dmg JuiceTracker.exe --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
